<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ isEditMode ? 'Edit Multi Expense' : 'Add Multi Expense' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="multiForm" (ngSubmit)="submitForm()">
    
    <ion-item>
      <ion-label position="floating">Title</ion-label>
      <ion-input formControlName="title"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Description (each item on new line)</ion-label>
      <ion-textarea
        formControlName="message"
        rows="6"
        placeholder="Example:
200₹ Groceries
500₹ Transport
150₹ Snacks"
      ></ion-textarea>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Category</ion-label>
      <ion-input formControlName="category"></ion-input>
    </ion-item>

    <ion-button
      expand="block"
      color="success"
      type="submit"
      [disabled]="isProcessing || multiForm.invalid"
      class="ion-margin-top"
    >
      {{ isEditMode ? 'Update Expense' : 'Save Expense' }}
    </ion-button>

  </form>
</ion-content>
