<ion-header class="header-clean">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button routerLink="/home">
        <ion-icon name="chevron-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Multi Expense</ion-title>
  </ion-toolbar>
<ion-toolbar class="filter-toolbar">

  <div class="filter-inline">

    <!-- SEARCH -->
    <ion-searchbar
      class="search-inline"
      mode="ios"
      [(ngModel)]="searchTerm"
      placeholder="Search..."
      (ionInput)="applyFilters()"
      debounce="400">
    </ion-searchbar>

    <!-- MONTH FILTER -->
    <ion-item lines="none" class="filter-inline-item">
      <ion-icon name="calendar-outline" slot="start"></ion-icon>

      <ion-select
        [(ngModel)]="selectedMonth"
        (ionChange)="applyFilters()"
        interface="popover"
        placeholder="Month">

        <ion-select-option value="all">All</ion-select-option>

        <ion-select-option
          *ngFor="let m of months"
          [value]="m">

          {{ m | slice:0:3 }}

        </ion-select-option>

      </ion-select>
    </ion-item>

  </div>

</ion-toolbar>
</ion-header>

<ion-content class="page-content">
  <ion-refresher slot="fixed" (ionRefresh)="refreshList($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-spinner *ngIf="loading" name="crescent" class="loader-center"></ion-spinner>

  <div class="total-hero-card" *ngIf="filteredExpenses.length > 0 && !loading">
    <div class="label-group">
      <ion-icon name="layers-outline"></ion-icon>
      <span>Total Multi-Expense</span>
    </div>
    <div class="amount-group">
      <span class="currency">₹</span>
      <span class="value">{{ totalFilteredAmount | number:'1.2-2' }}</span>
    </div>
    <div class="card-deco"></div>
  </div>

  <ion-list *ngIf="filteredExpenses.length > 0 && !loading" lines="none">
    <ion-item-sliding *ngFor="let exp of filteredExpenses; trackBy: trackById" class="slide-wrapper">
      <ion-item class="expense-card" button="true" detail="true" (click)="editAutoExpense(exp.id!)">
        <div class="icon-box" slot="start">
          <ion-icon name="layers-outline"></ion-icon>
        </div>

        <ion-label>
          <div class="top-row">
            <h2>{{ exp.title }}</h2>
            <span class="price-tag">₹{{ exp.total_amount }}</span>
          </div>

          <p class="description">{{ exp.description }}</p>

          <div class="meta-row">
            <span class="date">
              <ion-icon name="calendar-clear-outline"></ion-icon>
              {{ exp.created_at | date:'dd MMM' }}
            </span>
            <span class="cat-badge">{{ exp.category }}</span>
          </div>
        </ion-label>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option class="opt-btn edit" (click)="editAutoExpense(exp.id!)">
          <ion-icon slot="icon-only" name="create"></ion-icon>
        </ion-item-option>
        <ion-item-option class="opt-btn delete" (click)="deleteAutoExpense(exp.id!)">
          <ion-icon slot="icon-only" name="trash"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

  <ion-infinite-scroll
    *ngIf="filteredExpenses.length > 0"
    [disabled]="!hasMoreRecords || loadingMore"
    threshold="120px"
    (ionInfinite)="loadMoreExpenses($event)">
    <ion-infinite-scroll-content loadingSpinner="bubbles" loadingText="Loading more records..."></ion-infinite-scroll-content>
  </ion-infinite-scroll>

  <div *ngIf="!loading && filteredExpenses.length === 0" class="empty-state">
    <div class="icon-circle">
      <ion-icon name="layers-outline"></ion-icon>
    </div>
    <h3>No Records Found</h3>
    <p>Add a new multi-expense to get started.</p>
  </div>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="navigateToMultiExpense()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
