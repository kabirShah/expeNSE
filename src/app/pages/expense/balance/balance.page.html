<ion-header class="clean-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button [routerLink]="['/home']">
        <ion-icon name="chevron-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ isEdit ? 'Edit Transaction' : 'Add Money' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="money-content">
  
  <div class="main-container">
    <form [formGroup]="balanceForm" (ngSubmit)="saveBalance()">

      <div class="amount-hero">
        <p class="label">Enter Amount</p>
        <div class="input-wrapper">
          <span class="currency">₹</span>
          <ion-input 
            formControlName="amount" 
            type="number" 
            placeholder="0" 
            class="super-input">
          </ion-input>
        </div>
      </div>

      <div class="details-grid">
        
        <div class="custom-field">
          <label>Source / Description</label>
          <div class="field-box">
            <ion-icon name="wallet-outline" class="field-icon"></ion-icon>
            <ion-textarea 
              formControlName="source" 
              placeholder="e.g. Salary, Freelance..." 
              rows="1"
              autoGrow="true">
            </ion-textarea>
          </div>
        </div>

        <div class="custom-field">
          <label>Date Received</label>
          <div class="field-box">
            <ion-icon name="calendar-clear-outline" class="field-icon"></ion-icon>
            <ion-input 
              formControlName="date_added"
              type="date"
              class="date-input">
            </ion-input>
          </div>
        </div>

      </div>

    </form>
  </div>

</ion-content>

<ion-footer class="clean-footer">
  <ion-button 
    expand="block" 
    type="submit" 
    class="submit-btn" 
    (click)="saveBalance()" 
    [disabled]="balanceForm.invalid">
    {{ isEdit ? 'Update Balance' : 'Add Funds' }}
  </ion-button>
</ion-footer>
