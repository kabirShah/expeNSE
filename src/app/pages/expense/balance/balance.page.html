<ion-header class="clean-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button [routerLink]="['/home']" class="back-btn">
        <ion-icon name="close-outline" size="large"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Add Funds</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="form-bg-content">
  
  <div class="center-container">
    <form [formGroup]="balanceForm" (ngSubmit)="saveBalance()">

      <div class="amount-hero-section">
        <div class="currency-wrapper">
          <span class="currency-symbol">₹</span>
          <ion-input 
            formControlName="amount" 
            type="number" 
            placeholder="0" 
            class="big-amount-input">
          </ion-input>
        </div>
        <p class="helper-text">Enter amount to add to wallet</p>
      </div>

      <div class="form-card">
        
        <div class="input-group">
          <ion-item lines="none" class="custom-input-item large-input">
            <ion-icon slot="start" name="wallet-outline"></ion-icon>
            <ion-label position="floating">Source of Funds</ion-label>
            <ion-textarea 
              formControlName="source" 
              placeholder="E.g. Salary, Bonus..."
              rows="2">
            </ion-textarea>
          </ion-item>
        </div>

        <ion-button expand="block" type="submit" class="main-button" [disabled]="balanceForm.invalid">
          <ion-icon slot="start" name="add-circle-outline"></ion-icon>
          Add Balance
        </ion-button>
        
      </div>

    </form>
  </div>

</ion-content>
