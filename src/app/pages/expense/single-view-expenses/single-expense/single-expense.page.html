<ion-header class="clean-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button [routerLink]="['/single-view-expenses']" class="back-btn">
        <ion-icon name="arrow-back-outline" size="medium"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ expenseId ? 'Edit Transaction' : 'New Transaction' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="form-bg-content">
  <div class="form-container">
    <form [formGroup]="expenseForm" (ngSubmit)="saveExpense()" class="form-card">

      <!-- 1. HERO AMOUNT -->
      <div class="input-group amount-group">
        <ion-label class="field-label">Amount</ion-label>
        <div class="amount-wrapper">
          <span class="currency">₹</span>
          <ion-input 
            type="number" 
            formControlName="amount" 
            placeholder="0.00" 
            class="big-amount-input">
          </ion-input>
        </div>
      </div>

      <!-- 2. DATE & CATEGORY ROW -->
      <div class="form-row">
        <!-- Date Picker -->
        <div class="input-group half-width">
          <ion-label class="field-label">Date</ion-label>
          <ion-item lines="none" class="custom-input-item picker-item">
            <ion-icon slot="start" name="calendar-clear-outline"></ion-icon>
            <ion-datetime-button datetime="datetime"></ion-datetime-button>
          </ion-item>
        </div>

        <!-- Category Dropdown (Dynamic) -->
        <div class="input-group half-width">
          <ion-label class="field-label">Category</ion-label>
          <ion-item lines="none" class="custom-input-item">
            <ion-select 
              formControlName="category_id" 
              interface="popover" 
              placeholder="Select"
              [interfaceOptions]="{ cssClass: 'wide-popover' }">
              
              <!-- Iterate over the formatted categories from DB -->
              <ion-select-option *ngFor="let cat of categories" [value]="cat.id">
                {{ cat.displayName }}
              </ion-select-option>
              
            </ion-select>
          </ion-item>
        </div>
      </div>

      <!-- 3. TITLE -->
      <div class="input-group">
        <ion-label class="field-label">Title</ion-label>
        <ion-item lines="none" class="custom-input-item">
          <ion-icon slot="start" name="text-outline"></ion-icon>
          <ion-input formControlName="description" placeholder="e.g. Grocery Run"></ion-input>
        </ion-item>
      </div>

      <!-- 4. PAYMENT METHOD -->
      <div class="input-group">
        <ion-label class="field-label">Payment Method</ion-label>
        <ion-item lines="none" class="custom-input-item">
          <ion-icon slot="start" name="card-outline"></ion-icon>
          <ion-select formControlName="transaction_type" interface="popover" placeholder="Select Method">
            <ion-select-option *ngFor="let type of transactionTypes" [value]="type">{{ type }}</ion-select-option>
          </ion-select>
        </ion-item>
      </div>
      
      <!-- 5. NOTES (Manual Entry) -->
      <div class="input-group">
        <ion-label class="field-label">Notes (Optional)</ion-label>
        <ion-item lines="none" class="custom-input-item textarea-item">
          <ion-textarea 
            formControlName="notes" 
            rows="3" 
            placeholder="Add details (e.g. Milk, Eggs...)">
          </ion-textarea> 
        </ion-item>
      </div>

      <!-- SUBMIT BUTTON -->
      <ion-button expand="block" type="submit" class="main-button" [disabled]="expenseForm.invalid">
        {{ expenseId ? 'Update Transaction' : 'Save Transaction' }}
      </ion-button>

    </form>
  </div>

  <ion-modal [keepContentsMounted]="true">
    <ng-template>
      <ion-datetime id="datetime" presentation="date" formControlName="date"></ion-datetime>
    </ng-template>
  </ion-modal>

</ion-content>
