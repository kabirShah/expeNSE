<ion-header>
  <ion-toolbar>
    <ion-title>Scan Receipt</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="scan-page">

  <!-- Loader -->
  <div *ngIf="isLoading" class="loader-center">
    <ion-spinner></ion-spinner>
    <p>Scanning receipt...</p>
  </div>

  <!-- Capture Buttons -->
  <div class="scan-actions">
    <ion-button expand="block" (click)="captureImage()">
      📸 Take Photo
    </ion-button>

    <ion-button expand="block" fill="outline" (click)="pickFromGallery()">
      🖼 Upload from Gallery
    </ion-button>
  </div>

  <!-- Preview -->
  <div *ngIf="newReceipt.imageUrl" class="preview-box">
    <img [src]="newReceipt.imageUrl" />

    <div *ngIf="newReceipt.price" class="result">
      <h3>₹{{ newReceipt.price }}</h3>
      <p>{{ newReceipt.notes }}</p>
    </div>
  </div>

  <!-- Receipt List -->
  <ion-list *ngIf="receipts.length">

    <ion-item *ngFor="let r of receipts">
      <ion-thumbnail slot="start" (click)="openPreview(r.image_url)">
        <img [src]="r.image_url" />
      </ion-thumbnail>

      <ion-label>
        <h2>₹{{ r.price }}</h2>
        <p>{{ r.notes }}</p>
        <p>{{ r.date | date:'dd MMM yyyy' }}</p>
      </ion-label>

      <ion-button fill="clear" color="danger" (click)="deleteReceipt(r.id)">
        <ion-icon name="trash"></ion-icon>
      </ion-button>
    </ion-item>

  </ion-list>

  <!-- Preview Modal -->
  <div class="preview-modal" *ngIf="isPreviewOpen">
    <div class="overlay" (click)="closePreview()"></div>
    <img [src]="currentPreviewImage" />
  </div>

</ion-content>
