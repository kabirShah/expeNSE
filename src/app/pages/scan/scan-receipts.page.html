<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Receipts</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="isLoading" class="loader-center">
    <ion-spinner></ion-spinner>
    <p>Loading receipts...</p>
  </div>

  <div *ngIf="!isLoading && hasError" class="page">
    <ion-card>
      <ion-card-content>
        <h3>Could not load receipts</h3>
        <p>{{ errorMessage }}</p>
        <ion-button expand="block" (click)="loadReceipts()">Retry</ion-button>
      </ion-card-content>
    </ion-card>
  </div>

  <ion-list *ngIf="!isLoading && !hasError && receipts.length">
    <ion-item *ngFor="let r of receipts">
      <ion-thumbnail slot="start" *ngIf="r.file_url">
        <img [src]="r.file_url" />
      </ion-thumbnail>

      <ion-label>
        <h2>{{ r.title || 'Receipt' }}</h2>
        <p>₹{{ r.total_amount }} • {{ r.status || 'unknown' }}</p>
        <p>{{ r.created_at | date:'dd MMM yyyy' }}</p>
      </ion-label>

      <ion-button slot="end" fill="clear" color="danger" (click)="deleteReceipt(r.id)">
        <ion-icon name="trash"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <div *ngIf="!isLoading && !hasError && !receipts.length" class="page">
    <ion-card>
      <ion-card-content>
        <h3>No receipts yet</h3>
        <p>Scan a receipt to get started.</p>
        <ion-button expand="block" routerLink="/scan">Scan Receipt</ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
