<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button [routerLink]="['/home']">
        <ion-icon name="chevron-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Reports</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="6" *ngFor="let rt of reportTypes">
        <ion-button expand="block" fill="outline" (click)="generate(rt.type)">
          <ion-icon [name]="rt.icon" slot="start"></ion-icon>
          {{ rt.label }}
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-card>
    <ion-card-content>
      <ion-item>
        <ion-label position="stacked">From</ion-label>
        <ion-input type="date" [(ngModel)]="customFrom"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">To</ion-label>
        <ion-input type="date" [(ngModel)]="customTo"></ion-input>
      </ion-item>
      <ion-button expand="block" (click)="generate('custom')">Generate Custom</ion-button>
    </ion-card-content>
  </ion-card>

  <ion-spinner *ngIf="isLoading" class="loader-center" name="crescent"></ion-spinner>

  <ion-card *ngIf="currentReport?.summary">
    <ion-card-header>
      <ion-card-title>Summary</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>Expense: {{ currentReport.summary.total_expense | number:'1.2-2' }}</p>
      <p>Income: {{ currentReport.summary.total_income | number:'1.2-2' }}</p>
      <p>Net: {{ currentReport.summary.net | number:'1.2-2' }}</p>
    </ion-card-content>
  </ion-card>
</ion-content>
