<ion-header class="header-clean ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" color="dark"></ion-back-button>
    </ion-buttons>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="settings-profile-card" (click)="updateProfile()">
    <div class="profile-avatar">
      <img src="assets/profile.png" onerror="this.src='https://ionicframework.com/docs/img/demos/avatar.svg'" />
    </div>

    <div class="profile-info">
      <h2>Jay Shah</h2>
      <p>jay.shah</p>
    </div>

    <div class="edit-btn">
      <ion-icon name="chevron-forward-outline"></ion-icon>
    </div>
  </div>

  <div class="section-title">Account</div>
  <div class="settings-group">
    <ion-item button detail (click)="updateProfile()">
      <div class="icon-slot" slot="start">
        <ion-icon name="person-outline"></ion-icon>
      </div>
      <ion-label>Personal Info</ion-label>
    </ion-item>

    <ion-item button detail (click)="manageAccount()">
      <div class="icon-slot" slot="start">
        <ion-icon name="card-outline"></ion-icon>
      </div>
      <ion-label>Payment Methods</ion-label>
    </ion-item>
  </div>

  <div class="section-title">App Settings</div>
  <div class="settings-group">
    <ion-item>
      <div class="icon-slot active" slot="start">
        <ion-icon name="finger-print-outline"></ion-icon>
      </div>
      <ion-label>
        <h2>Biometric Login</h2>
        <p>Use Face ID / Fingerprint</p>
      </ion-label>
      <ion-toggle
        slot="end"
        [checked]="biometricEnabled"
        (ionChange)="onToggleBiometric($event)">
      </ion-toggle>
    </ion-item>

    <ion-item>
      <div class="icon-slot" slot="start">
        <ion-icon name="notifications-outline"></ion-icon>
      </div>
      <ion-label>Push Notifications</ion-label>
      <ion-toggle slot="end" [(ngModel)]="notificationsEnabled"></ion-toggle>
    </ion-item>

    <ion-item lines="none">
      <div class="icon-slot" slot="start">
        <ion-icon name="moon-outline"></ion-icon>
      </div>
      <ion-label>Dark Mode</ion-label>
      <ion-toggle
        slot="end"
        [checked]="isDarkMode"
        (ionChange)="toggleDarkMode($event)">
      </ion-toggle>
    </ion-item>
  </div>

  <div class="section-title">Legal</div>
  <div class="settings-group">
    <ion-item button detail (click)="viewPrivacyPolicy()">
      <div class="icon-slot" slot="start">
        <ion-icon name="shield-checkmark-outline"></ion-icon>
      </div>
      <ion-label>Privacy Policy</ion-label>
    </ion-item>

    <ion-item button detail lines="none" (click)="viewTerms()">
      <div class="icon-slot" slot="start">
        <ion-icon name="document-text-outline"></ion-icon>
      </div>
      <ion-label>Terms of Service</ion-label>
    </ion-item>
  </div>

  <div class="settings-group danger-zone">
    <ion-item button lines="none" (click)="logout()">
      <div class="icon-slot danger" slot="start">
        <ion-icon name="log-out-outline"></ion-icon>
      </div>
      <ion-label color="danger">Logout</ion-label>
    </ion-item>
  </div>

  <div class="version-text">Version 1.0.0</div>
</ion-content>
