<ion-header>
  <ion-toolbar>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="settings-bg">

  <!-- Profile -->
  <div class="settings-profile">
    <img src="assets/profile.png" class="profile-img" alt="Profile" />
    <h2>Olivia Bennett</h2>
    <p>olivia.bennett.mail.com</p>
  </div>

  <ion-list>

    <!-- Profile -->
    <ion-item>
      <ion-label>Profile</ion-label>
      <ion-button expand="full" (click)="updateProfile()">Update</ion-button>
    </ion-item>

    <!-- Notifications -->
    <ion-item>
      <ion-label>Notifications</ion-label>
      <ion-toggle
        slot="end"
        [(ngModel)]="notificationsEnabled">
      </ion-toggle>
    </ion-item>

    <!-- Biometric Login -->
    <ion-item>
      <ion-icon name="finger-print-outline" slot="start"></ion-icon>

      <ion-label>
        <h2>Biometric Login</h2>
        <p>Use Face ID / Fingerprint to sign in</p>
      </ion-label>

      <ion-toggle
        slot="end"
        [checked]="biometricEnabled"
        (ionChange)="onToggleBiometric($event)">
      </ion-toggle>
    </ion-item>

    <!-- Dark Mode -->
    <ion-item>
      <ion-label>Dark Mode</ion-label>
      <ion-toggle
        slot="end"
        [checked]="isDarkMode"
        (ionChange)="toggleDarkMode($event)">
      </ion-toggle>
    </ion-item>

    <!-- Account Management -->
    <ion-item>
      <ion-label>Account Management</ion-label>
      <ion-button expand="full" (click)="manageAccount()">Manage</ion-button>
    </ion-item>

    <!-- Privacy Policy -->
    <ion-item>
      <ion-label>Privacy Policy</ion-label>
      <ion-button expand="full" (click)="viewPrivacyPolicy()">View</ion-button>
    </ion-item>

    <!-- Terms -->
    <ion-item>
      <ion-label>Terms of Service</ion-label>
      <ion-button expand="full" (click)="viewTerms()">View</ion-button>
    </ion-item>

  </ion-list>

</ion-content>
