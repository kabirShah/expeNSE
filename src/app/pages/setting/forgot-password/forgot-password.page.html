<ion-content class="ion-padding auth-content">
  <div class="auth-wrapper">
    
    <div class="header-icon">
      <ion-icon name="lock-closed-outline" color="primary"></ion-icon>
    </div>

    <div class="header-text">
      <h1>Forgot Password?</h1>
      <p class="hint">
        Don't worry! It happens. Please enter the address associated with your account.
      </p>
    </div>

    <form class="auth-form">
      <ion-item lines="none" class="custom-input">
        <ion-icon slot="start" name="mail-outline" color="medium"></ion-icon>
        <ion-input
          type="email"
          label="Email Address"
          label-placement="floating"
          [(ngModel)]="email"
          name="email"
          email
          required
        ></ion-input>
      </ion-item>

      <ion-button
        class="submit-btn"
        expand="block"
        shape="round"
        color="primary"
        [disabled]="loading || !email"
        (click)="submit()"
      >
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        <span *ngIf="!loading">Submit</span>
      </ion-button>
    </form>

    <div class="footer-action">
      <ion-button fill="clear" color="medium" size="small" routerLink="/login">
        <ion-icon slot="start" name="arrow-back-outline"></ion-icon>
        Back to Login
      </ion-button>
    </div>

  </div>
</ion-content>
