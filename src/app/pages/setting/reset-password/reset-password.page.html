<ion-content class="ion-padding auth-content">
  <div class="auth-wrapper">

    <div class="header-text">
      <h1>Reset Password</h1>
      <p class="hint">
        Create a new, strong password that you haven't used before.
      </p>
    </div>

    <form class="auth-form">
      
      <ion-item lines="none" class="custom-input" [class.has-focus]="focusP">
        <ion-icon slot="start" name="lock-closed-outline" color="medium"></ion-icon>
        <ion-input
          [type]="showPassword ? 'text' : 'password'"
          label="New Password"
          label-placement="floating"
          [(ngModel)]="password"
          name="newPass"
          (ionFocus)="focusP=true" (ionBlur)="focusP=false"
        ></ion-input>
        <ion-button fill="clear" slot="end" (click)="showPassword = !showPassword">
          <ion-icon slot="icon-only" [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" color="medium"></ion-icon>
        </ion-button>
      </ion-item>

      <ion-item lines="none" class="custom-input" [class.error]="confirmPassword && password !== confirmPassword">
        <ion-icon slot="start" name="shield-checkmark-outline" color="medium"></ion-icon>
        <ion-input
          [type]="showPassword ? 'text' : 'password'"
          label="Confirm Password"
          label-placement="floating"
          [(ngModel)]="confirmPassword"
          name="confirmPass"
        ></ion-input>
      </ion-item>

      <div class="password-requirements">
        
        <div class="req-item" [class.valid]="password.length >= 8">
          <ion-icon [name]="password.length >= 8 ? 'checkmark-circle' : 'ellipse-outline'"></ion-icon>
          <span>At least 8 characters</span>
        </div>

        <div class="req-item" [class.valid]="hasNumber(password)">
          <ion-icon [name]="hasNumber(password) ? 'checkmark-circle' : 'ellipse-outline'"></ion-icon>
          <span>Contains a number</span>
        </div>

        <div class="req-item" [class.valid]="password && password === confirmPassword">
          <ion-icon [name]="password && password === confirmPassword ? 'checkmark-circle' : 'ellipse-outline'"></ion-icon>
          <span>Passwords match</span>
        </div>
      </div>

      <div class="spacer-20"></div>

      <ion-button
        class="submit-btn"
        expand="block"
        shape="round"
        [disabled]="loading || !isValid()"
        (click)="reset()"
      >
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        <span *ngIf="!loading">Reset Password</span>
      </ion-button>

    </form>
  </div>
</ion-content>
