<ion-content class="login-light">

  <div class="top-graphic"></div>

  <div class="login-container">

    <!-- Branding -->
    <div class="logo-box">
      <ion-icon name="wallet-outline"></ion-icon>
      <h1>Pocket Money</h1>
      <p class="subtitle">Smart way to manage your finances</p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="logForm" (ngSubmit)="login()" class="white-card">

      <!-- Email -->
      <ion-item class="input-item">
        <ion-icon slot="start" name="mail-outline"></ion-icon>
        <ion-input formControlName="email" type="email" placeholder="Email"></ion-input>
      </ion-item>

      <!-- Password -->
      <ion-item class="input-item">
        <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
        <ion-input
          formControlName="password"
          [type]="passwordType"
          placeholder="Password">
        </ion-input>

        <ion-icon 
          slot="end"
          [name]="passwordType === 'password' ? 'eye-off-outline' : 'eye-outline'"
          (click)="togglePasswordVisibility()">
        </ion-icon>
      </ion-item>

      <!-- Options -->
      <div class="options-row">
        <ion-checkbox formControlName="rememberMe"></ion-checkbox>
        <span class="remember-label">Remember Me</span>

        <a class="forgot" routerLink="/forgot-password">Forgot Password?</a>
      </div>

      <!-- Submit -->
      <ion-button expand="block" type="submit" class="btn-blue" [disabled]="logForm.invalid">
        <ion-spinner *ngIf="isLoading"></ion-spinner>
        <span *ngIf="!isLoading">Sign In</span>
      </ion-button>
    </form>

    <!-- Register Link -->
    <p class="register-text">
      Don’t have an account? 
      <a routerLink="/register">Register</a>
    </p>

    <!-- Biometrics -->
    <div class="bio-login" (click)="loginWithBiometric()">
      <ion-icon name="finger-print-outline"></ion-icon>
      <p>Login with Biometrics</p>
    </div>

  </div>
</ion-content>
