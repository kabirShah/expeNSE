<ion-content class="auth-content">
  <div class="auth-container">

    <!-- =====================
         BIOMETRIC LOADING
         ===================== -->
    <div *ngIf="checkingBiometric" class="biometric-loading">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Authenticating…</p>
    </div>

    <!-- =====================
         AUTH CONTENT
         ===================== -->
    <ng-container *ngIf="!checkingBiometric">

      <!-- Header -->
      <div class="auth-header">
        <div class="brand-logo">
          <ion-icon name="wallet-outline"></ion-icon>
        </div>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">
          Please enter your details to sign in.
        </p>
      </div>

      <!-- Login Form -->
      <form
        [formGroup]="logForm"
        (ngSubmit)="login()"
        class="auth-form">

        <!-- Email -->
        <div class="form-group">
          <ion-label position="stacked">Email Address</ion-label>
          <div class="input-wrapper">
            <ion-icon name="mail-outline" class="input-icon"></ion-icon>
            <ion-input
              formControlName="email"
              type="email"
              placeholder="Enter your email"
              class="custom-input">
            </ion-input>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <ion-label position="stacked">Password</ion-label>
          <div class="input-wrapper">
            <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
            <ion-input
              formControlName="password"
              [type]="passwordType"
              placeholder="Enter your password"
              class="custom-input">
            </ion-input>

            <ion-button
              fill="clear"
              class="eye-btn"
              type="button"
              (click)="togglePasswordVisibility()">
              <ion-icon
                [name]="passwordType === 'password'
                  ? 'eye-off-outline'
                  : 'eye-outline'"
                slot="icon-only">
              </ion-icon>
            </ion-button>
          </div>
        </div>

        <!-- Actions -->
        <div class="actions-row">
          <ion-checkbox
            formControlName="rememberMe"
            labelPlacement="end">
            Remember me
          </ion-checkbox>

          <a class="link-btn" (click)="forgotPassword()">
            Forgot password?
          </a>
        </div>

        <!-- Submit -->
        <ion-button
          expand="block"
          type="submit"
          class="primary-btn"
          [disabled]="logForm.invalid || isLoading">
          <ion-spinner
            *ngIf="isLoading"
            name="crescent">
          </ion-spinner>
          <span *ngIf="!isLoading">Sign in</span>
        </ion-button>

      </form>

      <!-- Footer -->
      <div class="auth-footer">
        <p>
          Don't have an account?
          <a (click)="goToRegister()">Create an account</a>
        </p>
      </div>

    </ng-container>

  </div>
</ion-content>
