<ion-content class="login-content">
  <div class="login-card">
    <h2>Pocket Money</h2>
    <p class="tagline">Smart Way to budget</p>

    <!-- Login Form -->
    <form [formGroup]="logForm" (ngSubmit)="login()">
      <!-- Email -->
      <ion-item class="custom-input">
        <ion-icon name="mail-outline" slot="start"></ion-icon>
        <ion-input type="email" formControlName="email" placeholder="Enter your email" required></ion-input>
      </ion-item>

      <!-- Password -->
      <ion-item class="custom-input">
        <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
        <ion-input [type]="passwordType" formControlName="password" placeholder="Enter password" required></ion-input>
        <ion-icon 
          [name]="passwordType === 'password' ? 'eye-off-outline' : 'eye-outline'" 
          slot="end" 
          (click)="togglePasswordVisibility()">
        </ion-icon>
      </ion-item>

      <!-- Remember Me + Forgot Password -->
      <div class="login-options">
        <ion-checkbox formControlName="rememberMe"></ion-checkbox>
        <ion-label>Remember Me</ion-label>
        <span class="forgot-password">
          <a routerLink="/forgot-password">Forgot Password?</a>
        </span>
      </div>

      <!-- Sign In Button -->
      <ion-button expand="block" type="submit" class="signin-btn" [disabled]="logForm.invalid">
        <ion-spinner *ngIf="isLoading"></ion-spinner>
        <ion-icon *ngIf="!isLoading" name="log-in-outline"></ion-icon>
        <span *ngIf="!isLoading">Sign In</span>
      </ion-button>
    </form>

    <!-- 🚀 Register placed OUTSIDE the form -->
    <p class="register-link">
      Don't have an account?
      <a routerLink="/register">Register</a>
    </p>      


    <!-- Biometric Login -->
    <div class="biometric-login">
      <ion-button fill="clear" (click)="loginWithBiometric()">
        <ion-icon name="finger-print" size="large"></ion-icon>
      </ion-button>
      <p>Sign in with Biometrics</p>
    </div>
  </div>
</ion-content>
