<ion-content class="auth-content">
  <div class="auth-container">
    <div *ngIf="showPageLoader" class="page-loader-overlay">
      <div class="loader-card">
        <ion-spinner name="crescent"></ion-spinner>
        <p>{{ loaderText }}</p>
      </div>
    </div>

    <div class="auth-header">
      <div class="brand-logo">
        <ion-icon name="wallet-outline"></ion-icon>
      </div>
      <h1 class="auth-title">Pocket Money</h1>
      <p class="auth-subtitle">Please enter your details to sign in.</p>
    </div>

    <form [formGroup]="logForm" (ngSubmit)="login()" class="auth-form">
      <div class="form-group">
        <ion-label position="stacked">Email Address</ion-label>
        <div class="input-wrapper">
          <ion-icon name="mail-outline" class="input-icon"></ion-icon>
          <ion-input
            formControlName="email"
            type="email"
            placeholder="Enter your email"
            class="custom-input">
          </ion-input>
        </div>
      </div>

      <div class="form-group">
        <ion-label position="stacked">Password</ion-label>
        <div class="input-wrapper">
          <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
          <ion-input
            formControlName="password"
            [type]="passwordType"
            placeholder="Enter your password"
            class="custom-input">
          </ion-input>

          <ion-button
            fill="clear"
            class="eye-btn"
            type="button"
            (click)="togglePasswordVisibility()">
            <ion-icon
              [name]="passwordType === 'password' ? 'eye-off-outline' : 'eye-outline'"
              slot="icon-only">
            </ion-icon>
          </ion-button>
        </div>
      </div>

      <div class="actions-row">
        <ion-checkbox formControlName="rememberMe" labelPlacement="end">
          Remember me
        </ion-checkbox>

        <a class="link-btn" (click)="forgotPassword()">Forgot password?</a>
      </div>

      <ion-button
        expand="block"
        type="submit"
        class="primary-btn"
        [disabled]="logForm.invalid || showPageLoader">
        <span>Sign in</span>
      </ion-button>
    </form>

    <div class="auth-footer">
      <p>
        Don't have an account?
        <a (click)="goToRegister()">Create an account</a>
      </p>
    </div>
  </div>
</ion-content>
