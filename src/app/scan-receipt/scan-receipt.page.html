<ion-header>
  <ion-toolbar>
    <ion-title>Scan & Receipt</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-button expand="block" (click)="scan()">Scan Receipt</ion-button>
  <ion-button expand="block" (click)="pickFromGallery()">Upload from Gallery</ion-button>

  <ion-item *ngIf="processing">
    <ion-label>Uploading / Processing...</ion-label>
    <ion-spinner slot="end"></ion-spinner>
  </ion-item>

  <ion-card *ngIf="lastReceipt">
    <img [src]="lastReceipt.receipt_image_url || (lastReceipt.receipt_image_path)" />
    <ion-card-header>
      <ion-card-title>{{ lastReceipt.merchant_name || 'Receipt' }}</ion-card-title>
      <ion-card-subtitle>{{ lastReceipt.transaction_date }}</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p>Total: {{ lastReceipt.total_amount }}</p>
    </ion-card-content>
  </ion-card>
</ion-content>
