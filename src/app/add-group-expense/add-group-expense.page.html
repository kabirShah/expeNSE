<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>Add Group Expense</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="submit()">Save</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form [formGroup]="form">
    <ion-item>
      <ion-label position="stacked">Title</ion-label>
      <ion-input formControlName="title" placeholder="Enter expense title"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Amount</ion-label>
      <ion-input type="number" formControlName="amount" placeholder="0.00"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Paid By</ion-label>
      <ion-select formControlName="paid_by">
        <ion-select-option *ngFor="let member of members" [value]="member.id">
          {{ member.user?.name ?? member.name }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Split Type</ion-label>
      <ion-select formControlName="split_type" (ionChange)="splitType = $event.detail.value">
        <ion-select-option value="equal">Equal</ion-select-option>
        <ion-select-option value="exact">Exact Amount</ion-select-option>
        <ion-select-option value="percentage">Percentage</ion-select-option>
        <ion-select-option value="shares">Shares</ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Date</ion-label>
      <ion-input type="date" formControlName="expense_date" [max]="getTodayDateValue()"></ion-input>
    </ion-item>
    <ion-note color="danger" *ngIf="form.get('expense_date')?.touched && form.get('expense_date')?.hasError('futureDate')">
      Future dates are not allowed.
    </ion-note>

    <ion-item>
      <ion-label position="stacked">Notes</ion-label>
      <ion-textarea formControlName="notes" placeholder="Optional notes"></ion-textarea>
    </ion-item>

    <!-- Split Configuration -->
    <ion-list-header>Split Among Members</ion-list-header>
    <div formArrayName="splits">
      <ion-item *ngFor="let split of splitsArray.controls; let i = index" [formGroupName]="i">
        <ion-label>
          <h3>{{ split.get('name')?.value }}</h3>
          <p *ngIf="splitType === 'equal'">₹{{ getEqualShare() }}</p>
        </ion-label>
        <ion-checkbox formControlName="included" slot="start"></ion-checkbox>

        <ion-input *ngIf="splitType === 'exact'" formControlName="amount" placeholder="Amount" slot="end"></ion-input>
        <ion-input *ngIf="splitType === 'percentage'" formControlName="percentage" placeholder="%" slot="end"></ion-input>
        <ion-input *ngIf="splitType === 'shares'" type="number" formControlName="shares" placeholder="Shares" slot="end"></ion-input>
      </ion-item>
    </div>
  </form>
</ion-content>
